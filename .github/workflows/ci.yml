# Continuous integration for Sitters4Us (ENSE707 Task 5).
#
# Every push and pull request to main goes through four quality gates (0-3), in
# order; a failure at any gate stops the run and marks the commit/PR red:
#   0. Secrets      - no .env file (or copy) is tracked and no real mysql:// URL appears in
#                     any tracked file (the repo is public; .env holds the database password).
#   1. Build        - the WPF app compiles (Release).
#   2. Smoke        - the core tests (TestCategory=Smoke, MySql excluded) prove the build is
#                     basically sane before spending time on the full suite.
#   3. Full suite   - all logic + integration tests in PetSitters.Tests.
# Results (.trx) are always uploaded as an artifact and summarised on the run page.
#
# CI never connects to the cloud MySQL database: the checkout has no .env
# (git-ignored), no DATABASE_URL secret is configured, and the MySQL parity
# tests (TestCategory=MySql) are excluded. Tests run on throwaway SQLite files.
# Do NOT add the production DATABASE_URL as a repository secret: run logs and
# artifacts of this public repo are public.
#
# The FlaUI UI suite (PetSitters.UiTests) is NOT run here: it drives a real
# desktop session and is run locally before merging instead. See docs/CI.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allows a manual run from the Actions tab

jobs:
  build-and-test:
    # The app is .NET Framework 4.7.2 WPF, which only builds on Windows.
    runs-on: windows-latest
    env:
      CONFIGURATION: Release

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: "Gate 0: No secrets committed"
        shell: pwsh
        run: |
          # 1. No secrets FILE is tracked: .env and copies/backups (.env*, *.env), except .env.example.
          $files = git ls-files | Where-Object {
              $name = Split-Path $_ -Leaf
              ($name -like '.env*' -or $name -like '*.env') -and $name -ne '.env.example'
          }
          if ($files) { Write-Error "Secret file(s) tracked in git: $($files -join ', ')"; exit 1 }
          
          # 2. No real database URL pasted into ANY tracked file. A mysql://user:password@host
          #    is allowed only with a placeholder or made-up host (HOST/host/h, localhost,
          #    127.0.0.1, *.example.com, *.test), which is all the docs and tests use.
          $allowedHost = '^(HOST|host|h|localhost|127\.0\.0\.1|([A-Za-z0-9-]+\.)*example\.com|([A-Za-z0-9-]+\.)*test)$'
          $leaks = @()
          foreach ($line in (git grep -n -I -E 'mysql://[^:/@[:space:]]+:[^@[:space:]]+@' -- .)) {
              foreach ($m in [regex]::Matches($line, 'mysql://[^:/@ "]+:[^@ "]+@([A-Za-z0-9.-]+)')) {
                  if ($m.Groups[1].Value -notmatch $allowedHost) { $leaks += (($line -split ':')[0..1] -join ':') }   # file:line only: CI logs are public
              }
          }
          if ($LASTEXITCODE -gt 1) { Write-Error 'git grep failed'; exit 1 }
          if ($leaks) { Write-Error ("Possible real database URL(s) in tracked files:`n" + ($leaks -join "`n")); exit 1 }
          Write-Output "No secret files or real database URLs tracked."
          exit 0   # explicit: GitHub's pwsh wrapper would otherwise exit with git grep's code (1 = no candidate lines)

      # The app is a classic (non-SDK) csproj: it needs Visual Studio's MSBuild,
      # not `dotnet build`. The SDK-style test project uses the .NET SDK.
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: "Gate 1: Build"
        # SkipTests: the csproj would otherwise run the tests inside the build;
        # here each stage is its own step so the log shows which gate failed.
        run: msbuild PetSitters.csproj /t:Restore,Build /p:Configuration=${{ env.CONFIGURATION }} /p:SkipTests=true /nologo /v:minimal

      - name: "Gate 2: Smoke tests"
        run: dotnet test PetSitters.Tests -c ${{ env.CONFIGURATION }} --nologo --filter "TestCategory=Smoke&TestCategory!=MySql" --logger "trx;LogFileName=smoke.trx" --results-directory TestResults

      - name: "Gate 3: Full logic + integration suite"
        run: dotnet test PetSitters.Tests -c ${{ env.CONFIGURATION }} --nologo --no-build --filter "TestCategory!=MySql" --logger "trx;LogFileName=full.trx" --results-directory TestResults

      - name: Summarise test results
        if: always()   # also report when a gate failed
        shell: pwsh
        run: |
          # Turn each .trx result file into a row on the run's summary page.
          $rows = foreach ($trx in Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue) {
            $c = ([xml](Get-Content $trx.FullName)).TestRun.ResultSummary.Counters
            "| $($trx.BaseName) | $($c.total) | $($c.passed) | $($c.failed) |"
          }
          $summary = @('### Test results', '', '| Stage | Total | Passed | Failed |', '|---|--:|--:|--:|') + $rows
          if (-not $rows) { $summary += '| (no results; build failed before tests ran) | | | |' }
          $summary -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
